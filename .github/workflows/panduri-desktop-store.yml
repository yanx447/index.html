name: Panduri Learning — Microsoft Store package

# MSIX packages can only be built on Windows. Run by hand once the app is reserved in Partner Center
# (Product identity page) and these repository variables are set:
#   MS_STORE_IDENTITY_NAME      Package/Identity/Name
#   MS_STORE_PUBLISHER          Package/Identity/Publisher (CN=...)
#   MS_STORE_PUBLISHER_NAME     Package/Properties/PublisherDisplayName
# Microsoft signs the package when it is published, so no certificate is needed here.
on:
  workflow_dispatch:

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the app
        working-directory: panduri/source
        run: |
          pip install pillow
          python build.py

      - name: Package
        working-directory: panduri/desktop
        env:
          IDENTITY: ${{ vars.MS_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MS_STORE_PUBLISHER_NAME }}
        run: |
          npm ci --ignore-scripts
          npx electron-builder --win appx --x64 "-c.appx.identityName=$env:IDENTITY" "-c.appx.publisher=$env:PUBLISHER" "-c.appx.publisherDisplayName=$env:PUBLISHER_NAME" "-c.appx.applicationId=Panduri"

      - uses: actions/upload-artifact@v4
        with:
          name: panduri-microsoft-store
          path: panduri/desktop/out/*.appx
