name: Panduri Learning — Android

on:
  push:
    branches: [main]
    paths:
      - 'panduri/**'
      - '!panduri/**.md'
      - '.github/workflows/panduri-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panduri-android
  cancel-in-progress: true

jobs:
  build:
    defaults:
      run:
        working-directory: panduri
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Native project
        run: bash scripts/native-setup.sh android
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: APK (test build — used only until the Studio Plus signing key is set up)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Panduri.apk

      - name: APK signed with the Studio Plus release key (same key for every build → updates install over each other)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../Panduri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: panduri-android-${{ github.run_number }}
          path: panduri/Panduri.apk

      - name: Publish download (GitHub Release "panduri-android-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete panduri-android-latest --yes --cleanup-tag || true
          gh release create panduri-android-latest Panduri.apk --prerelease \
            --title "ფანდური — Android #${{ github.run_number }}" \
            --notes "Panduri Learning for Android (v$(node -p "require('./package.json').version"), build ${{ github.run_number }}). Open this page on your Android phone, download Panduri.apk and install it (allow installs from this source when asked)."
