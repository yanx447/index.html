name: Sami Simi — Android

on:
  push:
    branches: [main]
    paths:
      - 'sami-simi/**'
      - '!sami-simi/**.md'
      - '!sami-simi/store/**'
      - '!sami-simi/docs/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    defaults:
      run:
        working-directory: sami-simi
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Engine tests
        run: npm test

      - name: Native project
        run: bash scripts/native-setup.sh android
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Debug APK (for testing)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SamiSimi-test.apk

      - name: Signed release AAB + APK (only when the keystore secrets exist)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android
          SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
          ./gradlew bundleRelease assembleRelease --no-daemon $SIGN
          cp app/build/outputs/bundle/release/app-release.aab ../SamiSimi-play.aab
          cp app/build/outputs/apk/release/app-release.apk ../SamiSimi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sami-simi-android-${{ github.run_number }}
          path: |
            sami-simi/SamiSimi-test.apk
            sami-simi/SamiSimi.apk
            sami-simi/SamiSimi-play.aab
          if-no-files-found: ignore

      - name: Publish download page (GitHub Release "android-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          FILES="SamiSimi-test.apk"
          [ -f SamiSimi.apk ] && FILES="$FILES SamiSimi.apk"
          gh release create android-latest $FILES --prerelease \
            --title "Android test build #${{ github.run_number }}" \
            --notes "Latest Android build of Sami Simi (v$(node -p "require('./package.json').version"), build ${{ github.run_number }}). Download the APK on an Android phone and install it (allow installs from this source when asked)."
