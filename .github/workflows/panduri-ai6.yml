name: Panduri AI — 6-instrument Demucs (guitar, piano) for the browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/panduri-ai6.yml'

permissions:
  contents: write

concurrency:
  group: panduri-ai6
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: demucs.onnx (MIT)
        run: git clone --depth 1 https://github.com/sevagh/demucs.onnx /tmp/donnx
      - name: Install
        run: |
          set -o pipefail
          mkdir -p panduri/ai-build/logs6
          exec > >(tee panduri/ai-build/logs6/install.txt) 2>&1
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          pip install "numpy<2" onnx==1.16.2 onnxruntime==1.19.2 dora-search diffq einops julius lameenc openunmix pyyaml tqdm soundfile
          pip install --no-deps -e /tmp/donnx/demucs-for-onnx
      - name: Export htdemucs_6s to ONNX (weights from Meta, MIT)
        run: |
          set -o pipefail
          python /tmp/donnx/scripts/convert-pth-to-onnx.py /tmp/onnx6 --six-source 2>&1 | grep -v TracerWarning | tail -8 | tee panduri/ai-build/logs6/export.txt
          ls -la /tmp/onnx6 | tee -a panduri/ai-build/logs6/export.txt
          python -c "from demucs.pretrained import get_model; print(','.join(get_model('htdemucs_6s').sources))" > /tmp/src6.txt
          cat /tmp/src6.txt | tee -a panduri/ai-build/logs6/export.txt
          test -f /tmp/onnx6/htdemucs_6s.onnx
      - name: Pack for the browser
        run: |
          set -o pipefail
          python panduri/ai-build/pack.py /tmp/onnx6/htdemucs_6s.onnx panduri/ai model6 htdemucs_6s "$(cat /tmp/src6.txt)" 2>&1 | tee panduri/ai-build/logs6/pack.txt
      - name: Reference separation of the test clip
        run: |
          set -o pipefail
          mkdir -p panduri/ai/ref6
          python panduri/ai-build/reference.py panduri/ai-build/test.wav panduri/ai/ref6 htdemucs_6s 2>&1 | tee panduri/ai-build/logs6/reference.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "panduri-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add panduri/ai-build/logs6 2>/dev/null || true; git add panduri/ai/model6 2>/dev/null || true; git add panduri/ai/ref6 2>/dev/null || true
          git commit -m "Panduri AI: 6-instrument Demucs model (guitar, piano)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
